<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111310">
  <meta name="description" content="CatStudyTik, uma trilha prática de engenharia de dados para full stack.">
  <title>CatStudyTik · Do pipeline à tela</title>
  <style>:root {
  color-scheme: dark;
  --bg: #111310;
  --panel: #191c17;
  --surface: #1e211a;
  --line: #30352b;
  --text: #f2f3e9;
  --muted: #afb4a5;
  --subtle: #949b8b;
  --green: #c8f788;
  --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
  font: 16px/1.5 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-width: 320px; }
body::before {
  content: ''; position: absolute; inset: 70px 0 auto; height: 280px;
  background: radial-gradient(ellipse at 49% -55%, #303c23 0%, transparent 68%);
  pointer-events: none;
}
button, a { -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 4px; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
svg { width: 18px; height: 18px; flex: 0 0 auto; }
.topbar { position: relative; z-index: 1; border-bottom: 1px solid #2a2e25; background: #141611; }
.top-inner, .shell { width: min(1280px, calc(100% - 112px)); margin-inline: auto; }
.top-inner { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 24px; height: 70px; }
.brand { justify-self: start; display: flex; align-items: center; gap: 11px; font-size: 21px; font-weight: 760; letter-spacing: -.055em; }
.brand strong { color: var(--green); font-weight: inherit; }
.mark { display: grid; place-items: center; width: 36px; height: 36px; background: var(--green); border-radius: 9px; }
.mark span { width: 21px; height: 18px; position: relative; background: #202718; clip-path: polygon(0 0, 19% 0, 19% 16%, 30% 16%, 30% 31%, 70% 31%, 70% 16%, 81% 16%, 81% 0, 100% 0, 100% 78%, 90% 78%, 90% 90%, 76% 90%, 76% 100%, 24% 100%, 24% 90%, 10% 90%, 10% 78%, 0 78%); }
.mark span::before, .mark span::after { content: ''; top: 55%; position: absolute; width: 3px; height: 3px; background: var(--green); }
.mark span::before { left: 23%; }
.mark span::after { right: 23%; }
.nav { display: flex; align-items: center; gap: 6px; }
.nav a { display: flex; align-items: center; gap: 8px; color: var(--muted); padding: 9px 14px; font-size: 14px; border: 1px solid transparent; border-radius: 8px; font-weight: 620; }
.nav a[aria-current] { color: var(--green); background: #232b1b; border-color: #35412a; }
.nav a:hover, .repo:hover { color: var(--text); }
.nav svg, .repo svg { width: 16px; height: 16px; }
.repo { justify-self: end; display: inline-flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; font-weight: 640; }
.shell { position: relative; padding: 41px 0 50px; }
.intro { display: flex; justify-content: space-between; align-items: end; gap: 24px; padding-bottom: 33px; border-bottom: 1px solid var(--line); }
.eyebrow { display: flex; align-items: center; gap: 9px; color: var(--green); font: 600 12px/1.5 var(--mono); letter-spacing: .135em; text-transform: uppercase; margin-bottom: 9px; }
.eyebrow::before { content: ''; background: currentColor; width: 7px; height: 7px; display: inline-block; box-shadow: 0 0 13px #aade5770; }
h1 { font-size: clamp(2.65rem, 5.1vw, 4.65rem); line-height: 1.02; font-weight: 775; letter-spacing: -.058em; }
.intro h1 span { color: var(--green); }
.intro p { margin-top: 14px; color: var(--muted); font-size: 17px; }
.progress { width: 247px; flex: 0 0 auto; border: 1px solid var(--line); border-radius: 12px; background: #1a1d17; padding: 14px 16px; }
.progress-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 650; font-size: 14px; }
.progress-head span:last-child { color: var(--green); font: 650 14px var(--mono); }
.meter { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; margin-top: 12px; }
.meter i { display: block; height: 5px; border-radius: 2px; background: #353b2c; }
.meter .part { background: linear-gradient(90deg, var(--green) 50%, #353b2c 50%); }
.meter .filled { background: var(--green); }
.progress small { margin-top: 7px; display: block; color: var(--subtle); font-size: 12px; }
.workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(297px, 344px); gap: 26px; margin-top: 24px; align-items: start; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 38px; margin-bottom: 12px; }
.section-head h2 { font-size: 22px; line-height: 1.2; letter-spacing: -.038em; }
.section-head .kicker { color: var(--subtle); font: 500 12px var(--mono); }
.quiet { display: inline-flex; gap: 7px; align-items: center; border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; background: #191c16; color: #c4c9bb; font-size: 13px; white-space: nowrap; }
.quiet:hover, .square:hover:not(:disabled) { border-color: #687658; color: var(--text); }
.quiet svg { width: 15px; height: 15px; }
.lesson { --accent: #c8f788; isolation: isolate; display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); border: 1px solid #435137; border-radius: 15px; overflow: hidden; position: relative; min-height: 310px; background: #1c2418; touch-action: pan-y pinch-zoom; }
.lesson[data-kind='armadilha'], .mini[data-kind='armadilha'] { --accent: #f1c581; }
.lesson[data-kind='desafio'], .mini[data-kind='desafio'] { --accent: #bfa7f5; }
.lesson[data-kind='boss'], .mini[data-kind='boss'] { --accent: #f1a88e; }
.lesson-content { position: relative; z-index: 1; padding: 25px 0 27px 25px; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
.lesson-meta { display: flex; align-items: center; gap: 11px; flex-wrap: wrap; }
.tag { color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); background: color-mix(in srgb, var(--accent) 10%, #151a14); display: inline-flex; gap: 6px; align-items: center; padding: 4px 8px; border-radius: 5px; font: 650 11px/1.4 var(--mono); letter-spacing: .075em; text-transform: uppercase; white-space: nowrap; }
.tag svg { width: 13px; height: 13px; }
.duration { color: #b4c0ac; font: 500 12px var(--mono); white-space: nowrap; display: inline-flex; gap: 5px; align-items: center; }
.duration svg { width: 14px; height: 14px; }
.lesson h3 { margin-top: 14px; font-size: clamp(1.95rem, 3.3vw, 3rem); line-height: 1.03; letter-spacing: -.052em; text-wrap: balance; }
.lesson p { margin: 11px 0 17px; color: #c4cbb9; font-size: 16px; line-height: 1.48; max-width: 40ch; }
.example { width: 100%; margin-top: auto; padding: 9px 11px; background: #10170fed; border: 1px solid #45543a; border-radius: 8px; }
.example-line { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: baseline; padding: 4px 0; }
.example-label { color: #acb7a2; font: 600 10px/1.5 var(--mono); letter-spacing: .045em; }
.example code { color: var(--accent); font: 500 12px/1.5 var(--mono); overflow-wrap: anywhere; }
.lesson-art { position: relative; min-width: 0; margin-left: -68px; }
.lesson-art img { position: absolute; inset: 0; height: 100%; width: 100%; object-fit: cover; object-position: 68% 50%; }
.lesson-art::after { position: absolute; inset: 0; content: ''; background: linear-gradient(90deg, #1c2418 0%, #1c2418d9 13%, transparent 45%), linear-gradient(0deg, #11190ebb, transparent 37%); }
.character-label { position: absolute; display: inline-flex; gap: 7px; align-items: center; bottom: 15px; right: 15px; z-index: 1; padding: 6px 8px; background: #121810db; color: #e2ecd7; border: 1px solid #7a896e6e; border-radius: 6px; font: 600 10px var(--mono); letter-spacing: .075em; text-transform: uppercase; }
.character-label i { width: 5px; height: 5px; background: var(--green); }
.bookmark { position: absolute; top: 13px; right: 13px; z-index: 3; color: #eef2e7; background: #11170fd9; border-color: #68735a; }
.bookmark[aria-pressed='true'] { color: var(--green); }
.bookmark[aria-pressed='true'] svg { fill: #c8f78843; }
.reader-controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: 12px 0 0; }
.arrows { display: flex; gap: 7px; }
.square { display: inline-grid; place-items: center; height: 40px; width: 40px; border: 1px solid var(--line); border-radius: 8px; background: #1b1f18; }
.square:disabled { color: #69715f; opacity: .78; }
.pager { display: flex; align-items: center; gap: 7px; }
.pager button { border: none; padding: 0; width: 16px; height: 32px; display: grid; place-items: center; background: transparent; }
.pager button::before { content: ''; width: 7px; height: 7px; background: #626a57; border-radius: 2px; }
.pager button[aria-current] { width: 23px; }
.pager button[aria-current]::before { width: 20px; background: var(--green); }
.pager button.is-done::before { background: #a4c77e; }
.count { color: var(--subtle); font: 500 12px var(--mono); margin-left: 5px; white-space: nowrap; }
.primary { justify-self: end; display: inline-flex; justify-content: center; align-items: center; gap: 8px; background: var(--green); border: 1px solid transparent; border-radius: 8px; color: #202818; font-size: 14px; line-height: 1.2; font-weight: 750; padding: 10px 14px; min-height: 40px; white-space: nowrap; }
.primary:hover { background: #defcae; }
.primary:disabled { opacity: .68; }
.primary svg { width: 16px; height: 16px; }
.phase-list { background: var(--panel); border: 1px solid var(--line); border-radius: 13px; padding: 7px; display: grid; gap: 3px; }
.phase { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%; min-height: 59px; padding: 8px; background: transparent; border: 1px solid transparent; border-radius: 8px; text-align: left; }
.phase:hover { background: #24291e; }
.phase[aria-current] { background: #262f21; border-color: #425437; }
.phase-icon { display: grid; place-items: center; width: 35px; height: 35px; background: #252a21; border: 1px solid #363c30; border-radius: 7px; color: #a6ae9d; }
.phase[aria-current] .phase-icon { background: #35462a; border-color: #4c603f; color: var(--green); }
.phase-title { display: block; font-size: 14px; line-height: 1.3; font-weight: 715; }
.phase-stack { display: block; margin-top: 3px; color: var(--subtle); font: 500 11px/1.4 var(--mono); }
.phase-state { font: 500 11px var(--mono); color: #acb4a2; }
.phase[aria-current] .phase-state, .phase .phase-state.done { color: var(--green); }
.aside-note { border: 1px solid var(--line); border-radius: 10px; background: #191c17; margin-top: 13px; padding: 11px 13px; display: flex; gap: 9px; align-items: center; color: var(--muted); font-size: 13px; }
.aside-note svg { color: #a4bd8c; width: 17px; vertical-align: middle; margin-right: 5px; }
.touch-hint { display: none; }
.deck { margin-top: 19px; border-top: 1px solid var(--line); padding-top: 15px; }
.deck .section-head { min-height: 28px; }
.deck .section-head h2 { font-size: 18px; }
.mini-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.mini { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; text-align: left; color: var(--text); padding: 12px; display: grid; gap: 9px; align-content: start; }
.mini:hover { border-color: #73856a; background: #23281e; }
.mini .tag { justify-self: start; }
.mini strong { font-size: 14px; line-height: 1.3; }
.mini small { font-size: 12px; color: var(--muted); }
.page-grid { display: grid; gap: 14px; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 23px; }
.phase-tile { padding: 18px; display: grid; gap: 11px; align-content: start; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.tile-head { display: flex; align-items: center; gap: 9px; justify-content: space-between; }
.tile-head .phase-state { color: var(--green); }
.phase-tile h2, .cat-tile h3 { font-size: 21px; letter-spacing: -.035em; }
.phase-tile p, .cat-tile p { color: var(--muted); }
.phase-tile .quiet { justify-self: start; }
.outcome { border-top: 1px solid var(--line); padding-top: 11px; font-size: 14px; }
.outcome strong { color: var(--green); display: block; margin-bottom: 3px; }
.collection { margin-top: 22px; }
.cat-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.cat-tile { border: 1px solid var(--line); border-radius: 11px; background: var(--panel); overflow: hidden; }
.cat-tile img { display: block; width: 100%; aspect-ratio: 1.25; object-fit: cover; object-position: center 42%; }
.cat-tile.locked img { filter: grayscale(1) brightness(.52); }
.cat-tile div { padding: 11px; }
.cat-tile small { color: var(--green); font: 500 11px var(--mono); }
.cat-tile p { margin-top: 4px; font-size: 14px; }
.saved { margin-top: 24px; }
.empty { padding: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; color: var(--muted); }
.focus .intro, .focus .right, .focus .deck { display: none; }
.focus .workspace { display: block; margin: 12px auto; max-width: 875px; }
.focus .lesson { min-height: 370px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

@media (pointer: coarse) {
  .key-hint { display: none; }
  .touch-hint { display: inline; }
}

@media (max-width: 1120px) {
  .top-inner, .shell { width: calc(100% - 56px); }
  .workspace { gap: 17px; grid-template-columns: minmax(0, 1fr) minmax(264px, 285px); }
  .lesson { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
  .lesson-content { padding-left: 18px; }
}
@media (max-width: 850px) {
  .top-inner, .shell { width: calc(100% - 40px); }
  .workspace { grid-template-columns: 1fr; }
  .right { margin-top: 5px; }
  .lesson { min-height: 290px; }
  .lesson-content { padding-left: 22px; }
  .page-grid, .cat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 540px) {
  .top-inner, .shell { width: calc(100% - 32px); }
  .top-inner { grid-template-columns: 1fr auto; height: auto; column-gap: 6px; row-gap: 10px; padding: 12px 0 8px; }
  .brand { font-size: 19px; }
  .mark { width: 30px; height: 30px; border-radius: 7px; }
  .mark span { transform: scale(.84); }
  .nav { grid-row: 2; grid-column: 1 / -1; gap: 5px; }
  .nav a { padding: 7px 10px; }
  .repo { grid-row: 1; grid-column: 2; }
  .shell { padding-top: 19px; }
  .intro { display: block; padding-bottom: 14px; }
  .intro h1 { font-size: clamp(2.1rem, 10.7vw, 2.65rem); }
  .intro p { font-size: 16px; margin-top: 10px; }
  .progress { margin-top: 15px; width: 100%; padding: 9px 11px; }
  .meter { margin-top: 8px; }
  .progress small { display: none; }
  .workspace { margin-top: 13px; }
  .section-head { margin-bottom: 9px; }
  .section-head h2 { font-size: 20px; }
  .lesson, .focus .lesson { grid-template-columns: 1fr; min-height: 0; }
  .lesson-content { grid-row: 2; padding: 15px; }
  .lesson-art { grid-row: 1; margin-left: 0; height: 123px; }
  .lesson-art img { object-position: 58% 41%; }
  .lesson-art::after { background: linear-gradient(0deg, #1c2418 0%, transparent 42%); }
  .character-label { bottom: 9px; right: 10px; }
  .lesson h3 { margin-top: 9px; }
  .lesson p { margin: 8px 0 13px; }
  .reader-controls { gap: 4px; padding-top: 9px; }
  .arrows { gap: 4px; }
  .arrows .square { width: 34px; }
  .pager { gap: 1px; }
  .count { display: none; }
  .primary { padding-inline: 8px; font-size: 13px; gap: 5px; }
  .mini-grid { grid-template-columns: 1fr; gap: 7px; }
  .mini { grid-template-columns: auto minmax(0, 1fr); align-items: center; }
  .saved .mini { grid-template-columns: 1fr; }
  .page-grid { grid-template-columns: 1fr; }
}
</style>
</head>

  <header class="topbar">
    <div class="top-inner">
      <a class="brand" href="#estudar" aria-label="CatStudyTik, estudar">
        <span class="mark" aria-hidden="true"><span></span></span>
        <span>CatStudy<strong>Tik</strong></span>
      </a>
      <nav class="nav" aria-label="Navegação principal">

  <main id="app" class="shell"></main>
  <div id="notice" class="visually-hidden" aria-live="polite" role="status"></div>
  <script type="application/json" id="content">{"phases": [{"id": "dados", "title": "Dados e contrato", "stack": "SQL · S3 · JSON", "icon": "database", "cat": "analista", "summary": "Transforme a origem dos cards em um contrato que Python e Angular possam usar.", "outcome": "Versione os cards, gere o JSON e valide o contrato.", "cards": [{"id": "dados-0", "tipo": "ponte", "titulo": "Do SELECT ao GET", "texto": "No Athena, você filtra linhas com WHERE. Em uma API, o cliente pede o filtro na URL e o backend decide como buscar os dados.", "exemplos": [{"rotulo": "ATHENA", "conteudo": "SELECT * FROM gatos WHERE cor = 'preto';"}, {"rotulo": "HTTP", "conteudo": "GET /gatos?cor=preto"}]}, {"id": "dados-1", "tipo": "armadilha", "titulo": "O contrato começa na resposta", "texto": "No Athena você controla a consulta. No frontend, você depende dos campos e tipos que a API promete. Se id virar número sem que o cliente saiba, o card pode deixar de abrir.", "exemplos": [{"rotulo": "CONTRATO", "conteudo": "{\"id\": \"dados-0\", \"tipo\": \"ponte\", \"titulo\": \"Do SELECT ao GET\"}"}, {"rotulo": "LIMITE", "conteudo": "Trate mudanças incompatíveis como uma nova versão do contrato."}]}, {"id": "dados-2", "tipo": "desafio", "titulo": "Modele um card", "texto": "Copie este baralho e mude o tipo de dados-0 para surpresa. Gere o JSON usando sua cópia como origem. Leia o erro, corrija o tipo e gere novamente.", "exemplos": [{"rotulo": "COMANDO", "conteudo": "python3 baralho.py gerar --origem sua-copia.md --saida teste.json"}, {"rotulo": "CHECAGEM", "conteudo": "O erro indica cards[0].tipo. Após a correção, valide teste.json."}]}, {"id": "dados-3", "tipo": "boss", "titulo": "Do Markdown ao JSON", "texto": "Abra um PR com uma alteração no primeiro baralho, o JSON regenerado e a saída da validação. Mostre que mudar o título preserva o id e que repetir um id ou deixar o texto de um card vazio é rejeitado.", "exemplos": [{"rotulo": "ENTREGA", "conteudo": "Markdown alterado, quatro cards em JSON e evidência da validação."}, {"rotulo": "ACEITE", "conteudo": "O JSON é reproduzível, os ids continuam estáveis e entradas inválidas falham."}]}]}, {"id": "lambda", "title": "Python na Lambda", "stack": "Python · AWS Lambda", "icon": "bolt", "cat": "dorminhoco", "summary": "Use Python para servir os cards e compare uma invocação HTTP com um evento do S3.", "outcome": "Entregue uma função testada para listar e consultar cards.", "cards": [{"id": "lambda-0", "tipo": "ponte", "titulo": "Do evento do S3 à requisição HTTP", "texto": "Você já leu registros de um evento do S3. Com API Gateway, o handler Python continua recebendo um evento, agora com informação sobre a requisição do navegador.", "exemplos": [{"rotulo": "S3", "conteudo": "O evento informa qual objeto mudou."}, {"rotulo": "HTTP", "conteudo": "A integração informa método, caminho e parâmetros."}]}, {"id": "lambda-1", "tipo": "armadilha", "titulo": "Trabalho que sobrevive à invocação", "texto": "O Dorminhoco pode reaproveitar o ambiente entre chamadas, mas o próximo evento pode cair em outro ambiente. Progresso de estudo precisa de armazenamento durável.", "exemplos": [{"rotulo": "TEMPORÁRIO", "conteudo": "Cache em memória pode desaparecer."}, {"rotulo": "DURÁVEL", "conteudo": "Persista progresso por usuária e id do card."}]}, {"id": "lambda-2", "tipo": "desafio", "titulo": "Faça o handler listar cards", "texto": "Use uma coleção local de cards no primeiro handler. Leia o filtro tipo, serialize a lista e compare com a resposta quando nenhum card combina.", "exemplos": [{"rotulo": "ENTRADA", "conteudo": "GET /cards?tipo=ponte"}, {"rotulo": "SAÍDA", "conteudo": "200 e uma lista JSON, vazia quando não houver resultados."}]}, {"id": "lambda-3", "tipo": "boss", "titulo": "Uma API testável em Python", "texto": "Abra um PR com o handler, a leitura do baralho e testes locais para lista, detalhe e id ausente. Separe a lógica de negócio da adaptação do evento HTTP.", "exemplos": [{"rotulo": "ENTREGA", "conteudo": "GET /cards e GET /cards/{id}"}, {"rotulo": "ACEITE", "conteudo": "Lista válida, detalhe conhecido e 404 para id inexistente."}]}]}, {"id": "gateway", "title": "API Gateway", "stack": "Rotas · HTTP · CORS", "icon": "route", "cat": "porteiro", "summary": "Exponha a função via HTTP e teste o acesso a partir da origem do frontend.", "outcome": "Entregue rotas acessíveis, exemplos de resposta e configuração de CORS.", "cards": [{"id": "gateway-0", "tipo": "ponte", "titulo": "Do trigger do Glue à rota HTTP", "texto": "No Glue Workflow, um evento inicia uma etapa. No Gateway, a combinação de método e caminho seleciona a integração que atende a requisição.", "exemplos": [{"rotulo": "TRIGGER", "conteudo": "Evento do workflow inicia o job."}, {"rotulo": "ROTA", "conteudo": "GET /cards seleciona a integração de leitura."}]}, {"id": "gateway-1", "tipo": "armadilha", "titulo": "No curl passa. No browser falha.", "texto": "O navegador aplica CORS quando o Angular chama uma API em outra origem. Um teste com curl confirma a rota, mas sozinho não verifica essa regra do navegador.", "exemplos": [{"rotulo": "ORIGEM", "conteudo": "Combine a rota com a origem efetiva do frontend."}, {"rotulo": "CHECAGEM", "conteudo": "Faça a chamada a partir da página e inspecione a aba Rede."}]}, {"id": "gateway-2", "tipo": "desafio", "titulo": "Atravesse a portaria", "texto": "Configure a rota GET /cards na API e invoque pela URL de teste. Confirme status, Content-Type e se o corpo tem os campos do contrato.", "exemplos": [{"rotulo": "ENTRADA", "conteudo": "GET /cards"}, {"rotulo": "ACEITE", "conteudo": "200, application/json e ids estáveis."}]}, {"id": "gateway-3", "tipo": "boss", "titulo": "Publique as rotas do baralho", "texto": "Abra um PR com a configuração do Gateway, exemplos de chamada e CORS para a origem de desenvolvimento. Documente qual limite de requisições você adotou para o laboratório.", "exemplos": [{"rotulo": "CASOS", "conteudo": "Lista, detalhe, id ausente e acesso pelo navegador."}, {"rotulo": "ACEITE", "conteudo": "Outra pessoa consegue repetir os testes usando o README."}]}]}, {"id": "angular", "title": "Frontend Angular", "stack": "TypeScript · RxJS", "icon": "layers", "cat": "desconfiado", "summary": "Construa o feed que lê a API com componentes, formulários e estados de carregamento.", "outcome": "Navegue pelo baralho e registre progresso pelo frontend.", "cards": [{"id": "angular-0", "tipo": "ponte", "titulo": "Do Glue Catalog ao TypeScript", "texto": "Use o contrato dos cards como fonte para a interface TypeScript. Ela ajuda o Angular a trabalhar com campos conhecidos, assim como o catálogo descreve os dados que você espera ler.", "exemplos": [{"rotulo": "CONTRATO", "conteudo": "Card tem id, tipo, titulo e texto."}, {"rotulo": "FRONTEND", "conteudo": "Um componente recebe um Card e desenha seu conteúdo."}]}, {"id": "angular-1", "tipo": "armadilha", "titulo": "O tipo não valida o JSON recebido", "texto": "Interfaces TypeScript ajudam durante a compilação. Se a API devolver um objeto diferente do combinado, a aplicação ainda precisa lidar com a resposta real.", "exemplos": [{"rotulo": "COMPILAÇÃO", "conteudo": "HttpClient.get\u003cCard[]>() informa o tipo esperado."}, {"rotulo": "EXECUÇÃO", "conteudo": "Valide o formato quando a fronteira exigir essa garantia."}]}, {"id": "angular-2", "tipo": "desafio", "titulo": "Dispare a leitura do baralho", "texto": "O HttpClient retorna um Observable e a requisição ocorre quando alguém assina. Lembre da execução preguiçosa do Spark para ligar a ideia, e use o async pipe para renderizar o resultado.", "exemplos": [{"rotulo": "SERVIÇO", "conteudo": "baralho$ = this.http.get\u003cCard[]>('/cards');"}, {"rotulo": "CHECAGEM", "conteudo": "A tela mostra estado de carregamento e a lista recebida."}]}, {"id": "angular-3", "tipo": "boss", "titulo": "Construa o feed de estudo", "texto": "Abra um PR com um componente de card, o serviço HTTP e o controle de avanço. Valide um formulário simples para anotar uma dúvida sobre o card.", "exemplos": [{"rotulo": "ENTREGA", "conteudo": "Feed, estados de erro e vazio, e formulário validado."}, {"rotulo": "ACEITE", "conteudo": "Uma pessoa consegue estudar e concluir o primeiro baralho."}]}]}, {"id": "ecs", "title": "API em container", "stack": "FastAPI · ECS Fargate", "icon": "box", "cat": "vigia", "summary": "Rode o mesmo contrato HTTP com FastAPI em um serviço ECS e compare com Lambda.", "outcome": "Execute o container e rode as mesmas verificações de contrato nos dois ambientes.", "cards": [{"id": "ecs-0", "tipo": "ponte", "titulo": "Da task que termina ao serviço que fica", "texto": "Um Glue job costuma executar trabalho finito. No ECS, uma task também pode executar e encerrar. Um ECS service é a configuração que mantém tasks disponíveis para atender chamadas.", "exemplos": [{"rotulo": "EXECUÇÃO PONTUAL", "conteudo": "ECS task para uma carga que termina."}, {"rotulo": "API DISPONÍVEL", "conteudo": "ECS service mantém a quantidade desejada de tasks."}]}, {"id": "ecs-1", "tipo": "armadilha", "titulo": "Mesma rota, outro perfil de operação", "texto": "Lambda invoca seu handler quando chega uma requisição. Um serviço no ECS mantém processos ativos e precisa de verificações de saúde e configuração de escala.", "exemplos": [{"rotulo": "LAMBDA", "conteudo": "Observe latência e inicialização sob demanda."}, {"rotulo": "ECS", "conteudo": "Observe saúde do processo e capacidade provisionada."}]}, {"id": "ecs-2", "tipo": "desafio", "titulo": "Suba a API no container", "texto": "Exponha a lógica de leitura dos cards em FastAPI e construa uma imagem. Rode localmente e compare o JSON da rota de lista com o JSON do handler Lambda.", "exemplos": [{"rotulo": "ROTA", "conteudo": "GET /cards"}, {"rotulo": "CHECAGEM", "conteudo": "Mesmo status e mesmo contrato para a mesma entrada."}]}, {"id": "ecs-3", "tipo": "boss", "titulo": "Compare Lambda e ECS Fargate", "texto": "Abra um PR com a imagem, a definição de task e as verificações de contrato. Registre o que observou sobre latência, escala e operação em cada alternativa.", "exemplos": [{"rotulo": "ACEITE", "conteudo": "As duas implementações passam pelo mesmo teste de contrato."}, {"rotulo": "DECISÃO", "conteudo": "Escreva em que cenário escolheria cada opção."}]}]}, {"id": "deploy", "title": "Deploy do laboratório", "stack": "S3 · CloudFront · IaC", "icon": "flag", "cat": "analista", "summary": "Coloque o Angular no ar e codifique a infraestrutura para reproduzir o ambiente.", "outcome": "Entregue a URL funcionando, a infraestrutura e um roteiro de verificação.", "cards": [{"id": "deploy-0", "tipo": "ponte", "titulo": "Do artefato de dados ao build web", "texto": "Você já publica saídas em S3. O build do Angular também gera artefatos, que serão servidos para o navegador via CloudFront a partir da origem S3.", "exemplos": [{"rotulo": "BUILD", "conteudo": "O Angular gera HTML, JavaScript e CSS."}, {"rotulo": "ENTREGA", "conteudo": "CloudFront serve esses arquivos ao navegador."}]}, {"id": "deploy-1", "tipo": "armadilha", "titulo": "Abrir a rota direto precisa funcionar", "texto": "Ao recarregar uma rota interna, o navegador pede aquele caminho ao host. Configure a distribuição para servir a entrada do Angular para rotas da SPA e preservar a resposta de arquivos reais ausentes.", "exemplos": [{"rotulo": "TESTE 1", "conteudo": "Recarregue /trilha direto na barra de endereços."}, {"rotulo": "TESTE 2", "conteudo": "Peça um arquivo JS inexistente e verifique o erro."}]}, {"id": "deploy-2", "tipo": "desafio", "titulo": "Faça um teste de ponta a ponta", "texto": "Abra a URL web, leia um card servido pela API e conclua a leitura. Recarregue a página e verifique o que aconteceu com o progresso.", "exemplos": [{"rotulo": "FLUXO", "conteudo": "Abrir → carregar → concluir → recarregar."}, {"rotulo": "ACEITE", "conteudo": "O progresso continua visível após a recarga."}]}, {"id": "deploy-3", "tipo": "boss", "titulo": "Entregue o laboratório", "texto": "Abra o PR final com a i const escape = value => String(value).replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
const svg = name => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]}</svg>`;
const number = value => String(value).padStart(2, '0');
const countPhase = phase => phase.cards.filter((_, index) => done.has(cardId(phase, index))).length;
const pageName = () => pages.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'estudar';

function progress() {
  const phaseCount = phases.filter(phase => countPhase(phase) === phase.cards.length).length;
  const segments = 12;
  const ratio = done.size / total * segments;
  return `<div class="progress" aria-label="Seu progresso, ${done.size} de ${total} cards concluídos">
    <div class="progress-head"><span>Seu progresso</span><span data-progress>${number(done.size)}/${total}</span></div>
    <div class="meter" aria-hidden="true">${Array.from({ length: segments }, (_, index) => `<i class="${index + 1 <= ratio ? 'filled' : index < ratio ? 'part' : ''}"></i>`).join('')}</div>
    <small>${phaseCount} de ${phases.length} fases concluídas</small>
  </div>`;
}

function intro(label, title, description) {
  return `<div class="intro"><div><div class="eyebrow">${label}</div><h1>${title}</h1><p>${description}</p></div>${progress()}</div>`;
}

function tag(card) {
  return `<span class="tag">${svg(kinds[card.tipo].icon)} ${kinds[card.tipo].label}</span>`;
}

function renderCard(phase, card, index) {
  const cat = cats[phase.cat];
  const bookmarked = saved.has(cardId(phase, index));
  return `<article class="lesson" data-kind="${card.tipo}" aria-labelledby="card-title">
    <div class="lesson-content">
      <div class="lesson-meta">${tag(card)}<span class="duration">${svg('clock')} ${kinds[card.tipo].duration}</span></div>
      <h3 id="card-title" tabindex="-1">${escape(card.titulo)}</h3>
      <p>${escape(card.texto)}</p>
      <div class="example">${card.exemplos.map(({ rotulo, conteudo }) => `<div class="example-line"><span class="example-label">${escape(rotulo)}</span><code>${escape(conteudo)}</code></div>`).join('')}</div>
    </div>
    <div class="lesson-art">
      <img src="${assets[cat.art || cat.asset]}" alt="">
      <span class="character-label"><i></i>${cat.name}</span>
    </div>
    <button class="square bookmark" type="button" data-action="bookmark" aria-pressed="${bookmarked}" aria-label="Salvar card">${svg('bookmark')}</button>
  </article>`;
}

function readerControls(phase) {
  const currentDone = done.has(cardId(phase, cardIndex));
  const finished = currentDone && done.size === total;
  const marks = phase.cards.map((card, index) => `<button type="button" data-card="${index}" class="${done.has(cardId(phase, index)) ? 'is-done' : ''}" ${cardIndex === index ? 'aria-current="true"' : ''} aria-label="Card ${index + 1}, ${escape(card.titulo)}"></button>`).join('');
  return `<div class="reader-controls">
    <div class="arrows" aria-label="Navegar pelos cards">
      <button class="square" type="button" data-action="prev" aria-label="Card anterior" ${cardIndex === 0 ? 'disabled' : ''}>${svg('left')}</button>
      <button class="square" type="button" data-action="next" aria-label="Próximo card" ${cardIndex + 1 === phase.cards.length ? 'disabled' : ''}>${svg('right')}</button>
    </div>
    <div class="pager">${marks}<span class="count">${number(cardIndex + 1)} / ${number(phase.cards.length)}</span></div>
    <button class="primary" type="button" data-action="complete" ${finished ? 'disabled' : ''}>${svg('check')} ${finished ? 'Trilha concluída' : currentDone ? 'Continuar' : 'Concluir card'}</button>
  </div>`;
}

function phaseList() {
  return phases.map((phase, index) => {
    const current = index === phaseIndex;
    const completed = countPhase(phase) === phase.cards.length;
    return `<button class="phase" type="button" data-phase="${index}" ${current ? 'aria-current="true"' : ''}>
      <span class="phase-icon">${svg(phase.icon)}</span>
      <span><span class="phase-title">${phase.title}</span><span class="phase-stack">${phase.stack}</span></span>
      <span class="phase-state ${completed ? 'done' : ''}">${completed ? '<span class="visually-hidden">Concluída</span>' + svg('check') : current ? 'ATUAL' : number(index + 1)}</span>
    </button>`;
  }).join('');
}

function deckTile(card, index, phase, nested = false) {
  const selector = nested ? `data-open="${phases.indexOf(phase)}:${index}"` : `data-card="${index}"`;
  return `<button class="mini" type="button" ${selector} data-kind="${card.tipo}">${tag(card)}<strong>${escape(card.titulo)}</strong>${nested ? `<small>${phase.title}</small>` : ''}</button>`;
}

function study() {
  const phase = phases[phaseIndex];
  const card = phase.cards[cardIndex];
  const deck = phase.cards.map((item, index) => index === cardIndex ? '' : deckTile(item, index, phase)).join('');
  return `${intro('Laboratório full stack', 'Do pipeline <span>à tela.</span>', 'Use o que você já sabe de dados para construir seu próprio app de estudo.')}
    <div class="workspace">
      <section aria-labelledby="deck-heading">
        <div class="section-head"><h2 id="deck-heading">Baralho de estudo</h2><button class="quiet" type="button" data-action="focus" aria-pressed="${focusMode}">${svg('focus')} ${focusMode ? 'Sair do foco' : 'Modo foco'}</button></div>
        ${renderCard(phase, card, cardIndex)}${readerControls(phase)}
        <section class="deck" aria-labelledby="remaining-heading">
          <div class="section-head"><h2 id="remaining-heading">Neste baralho</h2><span class="kicker">${phase.title}</span></div>
          <div class="mini-grid">${deck}</div>
        </section>
      </section>
      <aside class="right" aria-labelledby="phases-heading">
        <div class="section-head"><h2 id="phases-heading">Trilha de construção</h2><span class="kicker">${phases.length} fases</span></div>
        <div class="phase-list">${phaseList()}</div>
        <div class="aside-note"><span class="key-hint">${svg('keyboard')} Use <kbd>←</kbd> <kbd>→</kbd> para trocar de card.</span><span class="touch-hint">${svg('swipe')} Deslize para os lados para trocar de card.</span></div>
      </aside>
    </div>`;
}

function journey() {
  const tiles = phases.map((phase, index) => `<article class="phase-tile">
    <div class="tile-head"><span class="phase-icon">${svg(phase.icon)}</span><span class="phase-state">${countPhase(phase)}/${phase.cards.length} cards</span></div>
    <h2>${phase.title}</h2><span class="phase-stack">${phase.stack}</span><p>${phase.summary}</p>
    <p class="outcome"><strong>Entrega em PR</strong>${phase.outcome}</p>
    <button type="button" class="quiet" data-phase="${index}">${svg('book')} Abrir baralho</button>
  </article>`).join('');
  return `${intro('Plano de estudo', 'Trilha de <span>construção.</span>', 'Seis fases para colocar o próprio CatStudyTik no ar.')}<div class="page-grid">${tiles}</div>`;
}

function collection() {
  const mentors = Object.values(cats).map((cat, index) => {
    const unlocked = index === 0 || countPhase(phases[index - 1]) === phases[index - 1].cards.length;
    return `<article class="cat-tile ${unlocked ? '' : 'locked'}"><img src="${assets[cat.asset]}" alt=""><div>
      <small>${unlocked ? cat.skill : `Libera após a fase ${index}`}</small><h3>${cat.name}</h3><p>${cat.phrase}</p></div></article>`;
  }).join('');
  const bookmarks = phases.flatMap(phase => phase.cards.map((card, index) => saved.has(cardId(phase, index)) ? deckTile(card, index, phase, true) : '')).join('');
  return `${intro('Coleção', 'Gatos do <span>laboratório.</span>', 'Conclua fases para recrutar os mentores e guarde os cards que quiser rever.')}
    <section class="collection" aria-label="Mentores"><div class="cat-grid">${mentors}</div></section>
    <section class="saved" aria-labelledby="saved-heading"><div class="section-head"><h2 id="saved-heading">Cards salvos</h2><span class="kicker">${saved.size} card${saved.size === 1 ? '' : 's'}</span></div>
      ${bookmarks ? `<div class="mini-grid">${bookmarks}</div>` : '<p class="empty">Salve um card pelo ícone de marcador para encontrar aqui.</p>'}</section>`;
}

function render(focusSelector) {
  const currentPage = pageName();
  for (const link of document.querySelectorAll('.nav a')) {
    if (link.dataset.page === currentPage) link.setAttribute('aria-current', 'page');
    else link.removeAttribute('aria-current');
  }
  app.classList.toggle('focus', currentPage === 'estudar' && focusMode);
  app.innerHTML = { estudar: study, trilha: journey, colecao: collection }[currentPage]();
  if (focusSelector) {
    const target = app.querySelector(focusSelector);
    (target && !target.disabled ? target : app.querySelector('#card-title'))?.focus({ preventScroll: true });
  }
}

function selectCard(index, selector) {
  if (index < 0 || index >= phases[phaseIndex].cards.length) return;
  cardIndex = index;
  store();
  render(selector);
}

function openPhase(index, selectedCard) {
  phaseIndex = index;
  const phase = phases[index];
  const unfinished = phase.cards.findIndex((_, position) => !done.has(cardId(phase, position)));
  cardIndex = selectedCard ?? Math.max(0, unfinished);
  store();
  if (pageName() !== 'estudar') location.hash = 'estudar';
  else render('#card-title');
  document.querySelector('.topbar').scrollIntoView({ block: 'start' });
}

function completeCard() {
  const phase = phases[phaseIndex];
  const id = cardId(phase, cardIndex);
  if (!done.has(id)) {
    done.add(id);
    notice.textContent = countPhase(phase) === phase.cards.length ? `Fase concluída. ${phase.title}.` : `Card concluído. ${done.size} de ${total}.`;
  }
  if (cardIndex + 1 < phase.cards.length) {
    cardIndex += 1;
  } else if (done.size < total) {
    const order = [...phases.slice(phaseIndex), ...phases.slice(0, phaseIndex)];
    const next = order.find(item => countPhase(item) < item.cards.length);
    phaseIndex = phases.indexOf(next);
    cardIndex = next.cards.findIndex((_, position) => !done.has(cardId(next, position)));
  }
  store();
  render('#card-title');
}

app.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) return;
  const { action, card, phase, open } = button.dataset;
  if (phase !== undefined) openPhase(Number(phase));
  if (open) openPhase(...open.split(':').map(Number));
  if (card !== undefined) selectCard(Number(card), '#card-title');
  if (action === 'prev') selectCard(cardIndex - 1, '[data-action="prev"]');
  if (action === 'next') selectCard(cardIndex + 1, '[data-action="next"]');
  if (action === 'complete') completeCard();
  if (action === 'focus') {
    focusMode = !focusMode;
    render('[data-action="focus"]');
    document.querySelector('.topbar').scrollIntoView({ block: 'start' });
  }
  if (action === 'bookmark') {
    const id = cardId(phases[phaseIndex], cardIndex);
    if (saved.has(id)) saved.delete(id);
    else saved.add(id);
    notice.textContent = saved.has(id) ? 'Card salvo na coleção.' : 'Card removido dos salvos.';
    store();
    render('[data-action="bookmark"]');
  }
});

app.addEventListener('pointerdown', event => {
  if (event.pointerType !== 'touch' || !event.isPrimary || !event.target.closest('.lesson') || event.target.closest('button')) return;
  swipeStart = { id: event.pointerId, x: event.clientX, y: event.clientY };
});

app.addEventListener('pointercancel', () => {
  swipeStart = undefined;
});

app.addEventListener('pointerup', event => {
  if (!swipeStart || event.pointerId !== swipeStart.id) return;
  const horizontal = event.clientX - swipeStart.x;
  const vertical = event.clientY - swipeStart.y;
  swipeStart = undefined;
  if (Math.abs(horizontal) > 48 && Math.abs(horizontal) > Math.abs(vertical) * 1.4) {
    selectCard(cardIndex + (horizontal < 0 ? 1 : -1), '#card-title');
  }
});

document.addEventListener('keydown', event => {
  if (pageName() !== 'estudar' || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
  if (event.key === 'Escape' && focusMode) {
    focusMode = false;
    render('[data-action="focus"]');
  }
  if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') {
    event.preventDefault();
    selectCard(cardIndex + (event.key === 'ArrowRight' ? 1 : -1), '#card-title');
  }
});

window.addEventListener('hashchange', () => {
  render(pageName() === 'estudar' ? '#card-title' : undefined);
  window.scrollTo(0, 0);
});

for (const [page, icon] of Object.entries({ estudar: 'book', trilha: 'route', colecao: 'album' })) {
  document.querySelector(`[data-page="${page}"]`).insertAdjacentHTML('afterbegin', svg(icon));
}
document.querySelector('.repo').insertAdjacentHTML('afterbegin', svg('code'));
render();
</script>
</body>
</html>
